<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ReleaseProof — know which agent release is allowed to act, and why</title>
  <desc id="desc">An agent release workbench for budgeting, governance, and drift mitigation. Qualify, bind approval, and revalidate. Built with Pollard, Hashrope, and Epicormic for Nebius and NVIDIA.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#acc4bd" stroke-width=".6" opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="#142532"/>
  <rect x="729" y="0" width="471" height="620" fill="url(#grid)"/>
  <path d="M70 72h25l23 25-23 25H70Z" fill="none" stroke="#cce1b9" stroke-width="4"/>
  <path d="m81 98 9 9 19-23" fill="none" stroke="#cce1b9" stroke-width="4" stroke-linecap="round"/>
  <text x="141" y="116" fill="#f5f6ec" font-family="Segoe UI, Arial, sans-serif" font-size="53" letter-spacing="-2"><tspan font-weight="700">Release</tspan><tspan font-weight="350">Proof</tspan></text>
  <text x="72" y="166" fill="#a9c1c1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.2">THE AGENT RELEASE WORKBENCH</text>
  <g fill="#f8f6e9" font-family="Georgia, serif" font-size="57" letter-spacing="-1.8">
    <text x="70" y="275">Know which agent release</text>
    <text x="70" y="344">is allowed to act—</text>
    <text x="70" y="413" fill="#cce1b9">and why.</text>
  </g>
  <text x="72" y="486" fill="#b5c8c6" font-family="Segoe UI, Arial, sans-serif" font-size="20">Evidence before approval.</text>
  <text x="72" y="517" fill="#b5c8c6" font-family="Segoe UI, Arial, sans-serif" font-size="20">Boundaries before action.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M967 263v63m0 65v63" fill="none" stroke="#72948b" stroke-width="2" stroke-dasharray="5 6"/>
    <g transform="translate(809 210)">
      <rect width="316" height="80" rx="16" fill="#213846" stroke="#4b6869"/>
      <rect x="20" y="20" width="40" height="40" rx="11" fill="#cce1b9"/>
      <path d="m32 40 6 6 12-14" fill="none" stroke="#355c47" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="35" fill="#f1f3e8" font-size="19" font-weight="600">Qualify</text>
      <text x="80" y="58" fill="#a9c1bf" font-size="14">Measure the behavior</text>
    </g>
    <g transform="translate(809 322)">
      <rect width="316" height="80" rx="16" fill="#213846" stroke="#4b6869"/>
      <rect x="20" y="20" width="40" height="40" rx="11" fill="#cce1b9"/>
      <path d="M33 38v-5a7 7 0 0 1 14 0v5m-17 0h20v15H30Z" fill="none" stroke="#355c47" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="80" y="35" fill="#f1f3e8" font-size="19" font-weight="600">Bind approval</text>
      <text x="80" y="58" fill="#a9c1bf" font-size="14">Keep the exact contract</text>
    </g>
    <g transform="translate(809 434)">
      <rect width="316" height="80" rx="16" fill="#213846" stroke="#4b6869"/>
      <rect x="20" y="20" width="40" height="40" rx="11" fill="#cce1b9"/>
      <path d="M49 35a12 12 0 1 0 2 12m-2-21v10H39" fill="none" stroke="#355c47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="35" fill="#f1f3e8" font-size="19" font-weight="600">Revalidate</text>
      <text x="80" y="58" fill="#a9c1bf" font-size="14">Check before every action</text>
    </g>
  </g>
  <rect y="605" width="1200" height="195" fill="#eff1e6"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g fill="#385d47" font-size="21" font-weight="600">
      <text x="72" y="660">Smart budgeting</text>
      <text x="450" y="660">Smart governance</text>
      <text x="846" y="660">Drift mitigation</text>
    </g>
    <g fill="#6c7e6b" font-size="15">
      <text x="72" y="689">Reserve, then reconcile</text>
      <text x="450" y="689">Version, approve, enforce</text>
      <text x="846" y="689">Observe, hold, requalify</text>
    </g>
    <path d="M72 719H1127" stroke="#ced7c6"/>
    <text x="72" y="758" fill="#5b715c" font-size="15">Pollard <tspan fill="#a4b29c"> / </tspan> Hashrope <tspan fill="#a4b29c"> / </tspan> Epicormic</text>
    <text x="1127" y="758" fill="#5b715c" font-size="15" text-anchor="end">Built for Nebius × NVIDIA</text>
  </g>
</svg>

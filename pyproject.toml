[project]
name = "releaseproof"
version = "0.1.0"
description = "Qualification, budget governance, and drift containment for Nemotron agents."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muntaser Syed"}]
dependencies = ["pollard==1.6.2", "epicormic==0.2.0", "hashrope==0.2.2", "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "google-auth[requests]==2.62.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:pollard -p no:epicormic"
pythonpath = ["."]
